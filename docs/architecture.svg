<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1110" width="1340" height="1110" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d0d0d0"/>
    </marker>
    <style>
      .link   { fill: none; stroke: #d0d0d0; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .box    { fill: #1e1e1e; stroke: #e6e6e6; stroke-width: 1.6; }
      .bonus  { fill: #1e1e1e; stroke: #8a8a8a; stroke-width: 1.6; }
      .name   { fill: #e6e6e6; font-size: 20px; text-anchor: middle; }
      .sub    { fill: #a8a8a8; font-size: 14px; text-anchor: middle; }
      .port   { fill: #3a3a3a; }
      .portt  { fill: #d0d0d0; font-size: 15px; text-anchor: middle; }
      .title  { fill: #e6e6e6; font-size: 24px; font-weight: bold; }
      .vol    { fill: #1e1e1e; stroke: #e6e6e6; stroke-width: 1.6; }
      .legend { fill: #c8c8c8; font-size: 16px; text-anchor: middle; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1340" height="1110" fill="#1e1e1e"/>

  <!-- WWW -->
  <text x="670" y="30" class="title" text-anchor="middle">WWW</text>
  <g fill="none" stroke="#8b979e" stroke-width="3">
    <circle cx="670" cy="78" r="34"/>
    <ellipse cx="670" cy="78" rx="15" ry="34"/>
    <line x1="636" y1="78" x2="704" y2="78"/>
    <path d="M642,60 Q670,68 698,60"/>
    <path d="M642,96 Q670,88 698,96"/>
  </g>

  <!-- host + network -->
  <rect x="30" y="180" width="1280" height="760" rx="12" fill="#252525"/>
  <rect x="70" y="250" width="1200" height="470" rx="12" fill="#4f4f4f"/>
  <text x="95" y="700" class="title">Docker network: inception</text>
  <text x="55" y="920" class="title">Host machine</text>

  <!-- exposed ports: bus to WWW -->
  <path class="link" d="M170,148 L1170,148"/>
  <path class="link" d="M670,148 L670,116" marker-end="url(#arrow)"/>
  <path class="link" d="M170,148 L170,300" marker-end="url(#arrow)"/>
  <path class="link" d="M370,148 L370,300" marker-end="url(#arrow)"/>
  <path class="link" d="M570,148 L570,300" marker-end="url(#arrow)"/>
  <path class="link" d="M970,148 L970,530" marker-end="url(#arrow)"/>
  <path class="link" d="M1170,148 L1170,300" marker-end="url(#arrow)"/>

  <!-- internal links -->
  <path class="link" d="M570,412 L570,528" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="link" d="M770,412 L770,528" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="link" d="M642,585 L698,585" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="link" d="M842,585 L898,585" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- volume links -->
  <path class="link" d="M570,642 L570,790" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="link" d="M770,642 L770,790" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="link" d="M970,642 L970,820 L842,820" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <path class="link" d="M1170,412 L1170,852 L842,852" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- port labels -->
  <g>
    <rect class="port" x="146" y="203" width="48" height="24"/><text class="portt" x="170" y="220">8080</text>
    <rect class="port" x="346" y="203" width="48" height="24"/><text class="portt" x="370" y="220">8082</text>
    <rect class="port" x="546" y="203" width="48" height="24"/><text class="portt" x="570" y="220">8081</text>
    <rect class="port" x="950" y="203" width="40" height="24"/><text class="portt" x="970" y="220">443</text>
    <rect class="port" x="1110" y="203" width="120" height="24"/><text class="portt" x="1170" y="220">21, 21100-21110</text>

    <rect class="port" x="546" y="458" width="48" height="24"/><text class="portt" x="570" y="475">3306</text>
    <rect class="port" x="746" y="458" width="48" height="24"/><text class="portt" x="770" y="475">6379</text>
    <rect class="port" x="646" y="548" width="48" height="24"/><text class="portt" x="670" y="565">3306</text>
    <rect class="port" x="846" y="548" width="48" height="24"/><text class="portt" x="870" y="565">9000</text>
  </g>

  <!-- top row: bonus -->
  <rect class="bonus" x="100"  y="300" width="140" height="110" rx="10"/>
  <text class="name" x="170"  y="352">Static</text><text class="sub" x="170"  y="374">static site</text>
  <rect class="bonus" x="300"  y="300" width="140" height="110" rx="10"/>
  <text class="name" x="370"  y="352">DOOM</text><text class="sub" x="370"  y="374">browser game</text>
  <rect class="bonus" x="500"  y="300" width="140" height="110" rx="10"/>
  <text class="name" x="570"  y="352">Adminer</text><text class="sub" x="570"  y="374">DB admin UI</text>
  <rect class="bonus" x="700"  y="300" width="140" height="110" rx="10"/>
  <text class="name" x="770"  y="352">Redis</text><text class="sub" x="770"  y="374">object cache</text>
  <rect class="bonus" x="1100" y="300" width="140" height="110" rx="10"/>
  <text class="name" x="1170" y="352">FTP</text><text class="sub" x="1170" y="374">pure-ftpd</text>

  <!-- core row: mandatory -->
  <rect class="box" x="500" y="530" width="140" height="110" rx="10"/>
  <text class="name" x="570" y="582">MariaDB</text><text class="sub" x="570" y="604">database</text>
  <rect class="box" x="700" y="530" width="140" height="110" rx="10"/>
  <text class="name" x="770" y="582">WordPress</text><text class="sub" x="770" y="604">+ php-fpm</text>
  <rect class="box" x="900" y="530" width="140" height="110" rx="10"/>
  <text class="name" x="970" y="582">NGINX</text><text class="sub" x="970" y="604">TLS 1.2 / 1.3</text>

  <!-- volumes -->
  <g>
    <path class="vol" d="M500,802 L500,868 A70,12 0 0 0 640,868 L640,802"/>
    <ellipse class="vol" cx="570" cy="802" rx="70" ry="12"/>
    <text class="name" x="570" y="846" style="font-size:18px">mariadb</text>
    <path class="vol" d="M700,802 L700,868 A70,12 0 0 0 840,868 L840,802"/>
    <ellipse class="vol" cx="770" cy="802" rx="70" ry="12"/>
    <text class="name" x="770" y="846" style="font-size:18px">wordpress</text>
    <text class="sub" x="670" y="910">bind mounts in /home/&lt;login&gt;/data</text>
  </g>

  <!-- legend -->
  <g>
    <rect class="box" x="240" y="985" width="60" height="55" rx="8"/>
    <text class="legend" x="270" y="1075">Image</text>
    <rect class="bonus" x="440" y="985" width="60" height="55" rx="8"/>
    <text class="legend" x="470" y="1075">Bonus image</text>
    <path class="vol" d="M635,995 L635,1032 A35,8 0 0 0 705,1032 L705,995"/>
    <ellipse class="vol" cx="670" cy="995" rx="35" ry="8"/>
    <text class="legend" x="670" y="1075">Volume</text>
    <path class="link" d="M832,1012 L908,1012" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text class="legend" x="870" y="1075">Network link</text>
    <rect class="port" x="1046" y="1000" width="48" height="24"/><text class="portt" x="1070" y="1017">n</text>
    <text class="legend" x="1070" y="1075">Port</text>
  </g>
</svg>
