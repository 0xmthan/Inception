[www]
user  = www-data
group = www-data

; nginx is the only client, over the docker network
listen = 9000

; How many PHP worker processes to keep running: start with 2, keep 1–3 idle, never more than 10
pm = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Send worker output to the container's stderr
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

clear_env = no
