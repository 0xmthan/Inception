user  nginx;
worker_processes  auto;
pid  /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    access_log  /dev/stdout;
    error_log   /dev/stderr  warn;

    server {
        listen      8080;
        listen      [::]:8080;
        server_name _;

        root  /var/www/static;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
