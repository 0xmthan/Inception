name: inception

services:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    image: mariadb:1.0
    container_name: mariadb
    env_file: .env
    secrets:
      - db_password
      - db_root_password
    restart: always
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mariadb --protocol=socket -u root -p\"$$(cat /run/secrets/db_root_password)\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    image: wordpress:1.0
    container_name: wordpress
    env_file: .env
    secrets:
      - db_password
      - credentials
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    image: nginx:1.0
    container_name: nginx
    env_file: .env
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  redis:
    build:
      context: ./requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis:1.0
    container_name: redis
    env_file: .env
    restart: always
    networks:
      - inception

  ftp:
    build:
      context: ./requirements/bonus/ftp
      dockerfile: Dockerfile
    image: ftp:1.0
    container_name: ftp
    env_file: .env
    secrets:
      - ftp_password
    restart: always
    depends_on:
      - wordpress
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  adminer:
    build:
      context: ./requirements/bonus/adminer
      dockerfile: Dockerfile
    image: adminer:1.0
    container_name: adminer
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - inception

  static:
    build:
      context: ./requirements/bonus/static
      dockerfile: Dockerfile
    image: static:1.0
    container_name: static
    restart: always
    ports:
      - "8080:8080"
    networks:
      - inception

  doom:
    build:
      context: ./requirements/bonus/doom
      dockerfile: Dockerfile
    image: doom:1.0
    container_name: doom
    restart: always
    ports:
      - "8082:8082"
    networks:
      - inception

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  credentials:
    file: ../secrets/credentials.txt
  ftp_password:
    file: ../secrets/ftp_password.txt

volumes:
  wordpress:
    name: wordpress
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${WP_DATA_PATH}

  mariadb:
    name: mariadb
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DB_DATA_PATH}

networks:
  inception:
    name: inception
    driver: bridge
